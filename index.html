<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>·</title>
<style>
  :root { --bg:#f5f5f7; --fg:#1d1d1f; --muted:#6e6e73; --btn:#007aff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --muted:#98989d; --btn:#0a84ff; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font:17px -apple-system, system-ui, sans-serif; }
  main { text-align:center; padding:24px 16px; max-width:360px; }
  a.btn { display:inline-block; padding:14px 28px; border-radius:14px;
          background:var(--btn); color:#fff; text-decoration:none; font-weight:600; }
  p { color:var(--muted); font-size:14px; line-height:1.4; }
</style>
</head>
<body>
<main>
  <a class="btn" id="go" href="#">Open</a>
  <p id="note"></p>
</main>
<script>
  (function () {
    var h = location.hash.slice(1), p = {};
    if (h.indexOf("=") < 0) { p.m = h; }
    else h.split("&").forEach(function (kv) {
      var i = kv.indexOf("="); if (i > 0) p[kv.slice(0, i)] = kv.slice(i + 1);
    });
    function dec(s) { try { return decodeURIComponent(s || ""); } catch (e) { return s || ""; } }
    var m = dec(p.m).trim().replace(/^<|>$/g, ""), u = dec(p.u), g = dec(p.g);
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var btn = document.getElementById("go"), note = document.getElementById("note"), url = "";
    if (ios && m.indexOf("@") > 0) {
      url = "message://" + encodeURIComponent("<" + m + ">");
    } else {
      var base = "https://mail.google.com/mail/" + (u ? "?authuser=" + encodeURIComponent(u) : "");
      if (/^[0-9a-f]{10,20}$/i.test(g)) url = base + "#all/" + g;
      else if (m) url = base + "#search/" + encodeURIComponent("rfc822msgid:" + m);
    }
    if (!url) { btn.style.display = "none"; return; }
    btn.href = url;
    if (ios) {
      setTimeout(function () { location.href = url; }, 50);
      setTimeout(function () { note.textContent = "Tap if nothing happened."; }, 1500);
    } else {
      location.replace(url);
    }
  })();
</script>
</body>
</html>
